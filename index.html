<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>SmartMed</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23291c;--mute:#6f7664;--line:#e6e3d8;--g:#71834b;--gl:#eef2e7;--amber:#f3e2b8;--rose:#f6dcd8;--blue:#dce8f2;--sand:#efe6d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171a13;--card:#21261b;--ink:#eef0e8;--mute:#a2a996;--line:#343b2b;--gl:#2b3322;--amber:#4a4021;--rose:#4a2b27;--blue:#27384a;--sand:#3d3727;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;color:var(--g);font-size:22px;font-weight:700;margin-bottom:14px}.brand span span{color:var(--ink)}.brand small{display:block;font-size:8px;letter-spacing:.15em;color:var(--mute);font-weight:500}
.side-label{font-size:11px;letter-spacing:.12em;color:var(--mute);padding:6px 10px}
nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-align:left;width:100%}
.nav-item:hover{background:var(--gl)}.nav-item.active{background:var(--gl);color:var(--g);font-weight:600}
.nav-item b{margin-left:auto;background:var(--g);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.ic{display:inline-flex;width:20px;justify-content:center}
.sidebar-bottom{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px}.sidebar-bottom p,.profile p{margin:0;color:var(--mute);font-size:12px}
.profile{display:flex;align-items:center;gap:10px;padding:10px 4px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;flex-shrink:0}
.olive{background:var(--g);color:#fff}.peach{background:#f4d9c6;color:#6b3e1f}.blue{background:var(--blue);color:#24465f}.lavender{background:#e3dcf3;color:#473a6e}.avatar.small{width:30px;height:30px}
.main{flex:1;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.mobile-menu{display:none;font-size:22px}.breadcrumb{color:var(--mute)}.breadcrumb strong{color:var(--ink)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
.demo-pill{background:var(--amber);padding:3px 10px;border-radius:99px;font-size:12px}
.icon-button{position:relative;font-size:18px}.icon-button i{position:absolute;top:0;right:0;width:8px;height:8px;border-radius:50%;background:#d0594b}
.content{padding:28px;max-width:1200px}
.page-heading{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--g);font-weight:600}
h1{margin:4px 0;font-size:30px}h2{margin:0;font-size:17px}p{margin:2px 0}.page-heading p,.card-head p,.section-toolbar p,.overview-title p{color:var(--mute)}
.date-chip{background:var(--card);border:1px solid var(--line);padding:7px 14px;border-radius:99px;font-size:13px}
.overview-title,.section-toolbar,.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.text-link{color:var(--g);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{display:flex;gap:12px;align-items:center}.stat p{margin:0;color:var(--mute);font-size:12px}.stat strong{font-size:26px;display:block;line-height:1.2}.stat small{color:var(--mute)}
.stat-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.green{background:var(--gl)}.sand{background:var(--sand)}.rose{background:var(--rose)}.stat-icon.blue{background:var(--blue)}
.dashboard-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;font-size:11px;letter-spacing:.08em;color:var(--mute);padding:8px;border-bottom:1px solid var(--line)}td{padding:10px 8px;border-bottom:1px solid var(--line)}td small{display:block;color:var(--mute)}
.medicine-cell{display:flex;gap:10px;align-items:center}.med-icon{width:34px;height:34px;border-radius:10px;background:var(--gl);display:grid;place-items:center}
.status{padding:3px 10px;border-radius:99px;font-size:12px;white-space:nowrap}.status.success{background:var(--gl);color:var(--g)}.status.upcoming{background:var(--sand)}.status.warning{background:var(--amber)}
.online{color:var(--g);font-weight:600}.device-visual{display:flex;gap:14px;align-items:center;background:var(--gl);border-radius:12px;padding:14px;margin-bottom:10px}
.device-icon{width:54px;height:64px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:18px}
.device-row,.detail-line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.device-row em{font-style:normal;color:var(--g);font-size:12px;margin-left:6px}
.outline-button,.primary-button,.subtle-button{border-radius:10px;padding:9px 14px;font-weight:600}
.outline-button{border:1px solid var(--g);color:var(--g);margin-top:12px;width:100%}.outline-button.compact{width:auto;margin:0}
.primary-button{background:var(--g);color:#fff}.subtle-button{color:var(--mute)}
.patient-row,.alert-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.patient-row p,.alert-row p{margin:0;color:var(--mute);font-size:12px}.patient-row .clickable{flex:1;cursor:pointer}.patient-row>div:nth-child(2){flex:1}.alert-row>div:nth-child(2){flex:1}
.alert-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}.alert-icon.amber{background:var(--amber)}.alert-icon.blush{background:var(--rose)}.alert-icon.green{background:var(--gl)}
.tip{margin-top:12px;background:var(--gl);padding:10px 12px;border-radius:10px;color:var(--g)}
.footer-note{margin-top:20px;color:var(--mute);font-size:12px;text-align:center}
.notice{display:flex;align-items:center;gap:8px;background:var(--gl);color:var(--g);padding:10px 14px;border-radius:10px;margin-bottom:16px}.notice button{margin-left:auto}
.secondary-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.report-grid .card{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.info-panel{display:flex;gap:16px;align-items:center;margin-top:18px;background:var(--gl);border-radius:16px;padding:18px}.scan-frame{width:64px;height:64px;border:2px dashed var(--g);border-radius:12px;display:grid;place-items:center;font-size:26px;flex-shrink:0}
.muted{color:var(--mute);font-size:12px;margin-top:8px}
.chart{margin-top:18px}.chart-area{height:150px}.chart-area svg{width:100%;height:100%}.chart-area .chart-lines{display:none}.chart-labels{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;margin-top:6px}
select,input{border:1px solid var(--line);background:var(--card);padding:8px 10px;border-radius:10px}
.add-row{display:flex;gap:8px;margin-bottom:14px}.add-row input{flex:1}
.modal-overlay{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:16px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}.login-card label{display:block;font-size:12px;color:var(--mute)}.login-card input,.login-card select{width:100%;margin-top:5px;color:var(--ink)}.login-note{font-size:12px;color:var(--mute)}
@media(max-width:900px){.stats,.stats.three{grid-template-columns:1fr 1fr}.dashboard-grid,.secondary-grid{grid-template-columns:1fr}
.sidebar{position:fixed;z-index:20;left:0;top:0;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.mobile-menu{display:block}.content{padding:18px}.top-name{display:none}}
@media(max-width:520px){.stats,.stats.three{grid-template-columns:1fr}}
</style></head>
<body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel">
const {useState}=React;
const G={Dashboard:'▦',Patients:'👥',Medications:'💊','Dispensing Schedule':'📅','Medicine Storage':'❄',Inventory:'📦','Health Monitoring':'♥',Notifications:'🔔',Reports:'📄',Settings:'⚙'};
const nav=Object.keys(G);
const I=({n})=><span className="ic" aria-hidden="true">{n}</span>;
const patients0=[{name:'Eleanor Pena',initials:'EP',detail:'Patient 01 · NFC connected',color:'peach'},{name:'Robert Fox',initials:'RF',detail:'Patient 02 · NFC connected',color:'blue'},{name:'Cameron Williamson',initials:'CW',detail:'Patient 03 · NFC connected',color:'lavender'}];
const meds=[{name:'Metformin',dose:'500 mg · 1 tablet',patient:'Eleanor Pena',time:'08:00 AM',status:'Collected',stock:'24 tablets'},{name:'Lisinopril',dose:'10 mg · 1 tablet',patient:'Robert Fox',time:'09:00 AM',status:'Upcoming',stock:'8 tablets'},{name:'Atorvastatin',dose:'20 mg · 1 tablet',patient:'Eleanor Pena',time:'12:00 PM',status:'Upcoming',stock:'18 tablets'},{name:'Vitamin D3',dose:'1000 IU · 1 capsule',patient:'Cameron Williamson',time:'02:00 PM',status:'Upcoming',stock:'32 capsules'}];
const Logo=()=><div className="brand"><span style={{fontSize:30}}>⚕</span><span>Smart<span>Med</span><small>SMART CARE, SIMPLIFIED</small></span></div>;
const Stat=({icon,label,value,sub,tone})=><div className="stat card"><div className={'stat-icon '+tone}>{icon}</div><div><p>{label}</p><strong>{value}</strong><small>{sub}</small></div></div>;
const Chart=({title,subtitle})=><section className="card chart"><div className="card-head"><div><h2>{title}</h2><p>{subtitle}</p></div><span className="status success">Weekly</span></div><div className="chart-area"><svg viewBox="0 0 700 150" preserveAspectRatio="none" aria-label="Example trend chart"><path d="M0 105 C60 90 80 105 130 83 S210 68 260 81 S340 55 390 65 S460 85 520 53 S630 70 700 42 V150 H0Z" fill="var(--gl)"/><path d="M0 105 C60 90 80 105 130 83 S210 68 260 81 S340 55 390 65 S460 85 520 53 S630 70 700 42" fill="none" stroke="var(--g)" strokeWidth="3"/></svg></div><div className="chart-labels">{['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d=><span key={d}>{d}</span>)}</div></section>;
const Panel=({icon,title,text})=><div className="info-panel"><span style={{fontSize:28}}>{icon}</span><div><h2>{title}</h2><p>{text}</p></div></div>;

function Secondary({page,go,selected,setSelected,list,setList,alerts,setAlerts,action}){
 const [newName,setNewName]=useState('');
 const add=()=>{const n=newName.trim();if(!n)return;if(list.length>=5)return action('Maximum of five patients reached.');
  setList([...list,{name:n,initials:n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(),detail:'NFC wearable not assigned',color:'blue'}]);setNewName('');action('Example patient added locally.')};
 const rows=(inv)=><section className="card"><div className="table-wrap"><table><thead><tr>{['MEDICINE','DOSE','QUANTITY','MINIMUM','EXPIRY','STATUS'].map(h=><th key={h}>{h}</th>)}</tr></thead><tbody>{meds.map((m,i)=><tr key={m.name}><td><strong>{m.name}</strong><small>Batch SM-00{i+1}</small></td><td>{m.dose}</td><td>{m.stock}</td><td>10 units</td><td>{i===0?'Nov 20, 2024':'Mar 12, 2025'}</td><td><span className={'status '+(i===1?'warning':'success')}>{i===1?'Low stock':'In stock'}</span></td></tr>)}</tbody></table></div></section>;
 const download=r=>{const b=new Blob([`SmartMed example report\n${r}\nDemo data only. Not a medical record.`],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='smartmed-example-report.txt';a.click();URL.revokeObjectURL(a.href)};
 const extra=['Upcoming dose: Atorvastatin','Medicine expiring soon: Metformin','Example: uncollected dose reminder','Example: abnormal measurement','Example: low battery or connection issue'];
 return <>
 <div className="page-heading"><div><div className="eyebrow">SMARTMED WORKSPACE</div><h1>{page}</h1><p>Manage and explore your connected care, all in one place.</p></div><span className="date-chip">Example data · Demo only</span></div>
 {page==='Patients'&&<><div className="section-toolbar"><div><h2>Patient profiles</h2><p>{list.length} of 5 profiles connected to this unit</p></div></div>
  <div className="add-row"><input value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="New patient name"/><button className="primary-button" onClick={add}>+ Add patient</button></div>
  <div className="secondary-grid"><section className="card">{list.map(p=><div className="patient-row" key={p.name}><div className={'avatar '+p.color}>{p.initials}</div><div className="clickable" onClick={()=>setSelected(p.name)}><strong>{p.name}</strong><p>{p.detail}</p></div><button className="text-link" onClick={()=>setSelected(p.name)}>View profile</button><button className="subtle-button" onClick={()=>{setList(list.filter(x=>x.name!==p.name));action('Example profile removed locally.')}}>Remove</button></div>)}</section>
  <section className="card"><div className="eyebrow">PATIENT PROFILE</div><h2>{selected}</h2><p className="muted">Individual care overview</p><div className="detail-line">NFC wearable <strong>Assigned · Demo</strong></div><div className="detail-line">Medication schedule <strong>View doses</strong></div><div className="detail-line">Health measurements <strong>Available in history</strong></div><button className="outline-button" onClick={()=>go('Health Monitoring')}>View health monitoring →</button></section></div></>}
 {(page==='Medications'||page==='Inventory')&&<><div className="section-toolbar"><div><h2>{page==='Inventory'?'Medicine inventory':'Medicines in your device'}</h2><p>Review quantities, schedules and storage details.</p></div><button className="primary-button" onClick={()=>action(page==='Inventory'?'Refill confirmation is a demonstration only.':'Scanning is a demonstration only; no scanner is connected.')}>+ {page==='Inventory'?'Confirm refill':'Scan medicine'}</button></div>{rows()}
  {page==='Medications'&&<div className="info-panel"><div className="scan-frame">▥</div><div><h2>Medicine scanning</h2><p>Scan a barcode or QR code to check the medicine against its assigned compartment. Mismatched medicines must not be accepted.</p><span className="status success">✓ Example: medicine verified</span><p className="muted">Scanner and medicine identification are not connected in this prototype.</p></div></div>}</>}
 {page==='Dispensing Schedule'&&<><div className="section-toolbar"><div><h2>Today's doses</h2><p>Example schedule</p></div></div><section className="card"><div className="table-wrap"><table><thead><tr>{['MEDICATION','PATIENT','SCHEDULED','COLLECTION STATUS'].map(h=><th key={h}>{h}</th>)}</tr></thead><tbody>{meds.map(m=><tr key={m.name}><td><strong>{m.name}</strong><small>{m.dose}</small></td><td>{m.patient}</td><td>{m.time}</td><td><span className="status upcoming">{m.status}</span></td></tr>)}</tbody></table></div></section><Panel icon="🛡" title="Safety before dispensing" text="NFC identification and medication verification precede scheduled dispensing. A failed verification stops dispensing and raises an alert. Collection confirms availability was collected, not that medication was swallowed."/></>}
 {page==='Medicine Storage'&&<><div className="stats three"><Stat icon="🌡" label="Compartment temperature" value="4.2°C" sub="Example reading" tone="green"/><Stat icon="🔋" label="Battery level" value="92%" sub="Power connected" tone="blue"/><Stat icon="📶" label="Device connection" value="Online" sub="Example status" tone="sand"/></div><Chart title="Temperature history" subtitle="Cooling compartment · Example readings"/><Panel icon="❄" title="Storage requirements matter" text="Not all medicines require refrigeration. Follow each medicine's storage requirements. Temperature, cooling, and power failure alerts are illustrated only; monitoring is not connected."/></>}
 {page==='Health Monitoring'&&<><div className="section-toolbar"><div><h2>Patient health overview</h2><p>Example measurements for human review, not diagnosis.</p></div><select value={selected} onChange={e=>setSelected(e.target.value)}>{list.map(p=><option key={p.name}>{p.name}</option>)}</select></div><div className="stats three"><Stat icon="♥" label="Heart rate" value="72 bpm" sub="Within example range" tone="green"/><Stat icon="〰" label="Blood pressure" value="120/80" sub="mmHg · Example reading" tone="blue"/><Stat icon="🌡" label="Temperature" value="36.7°C" sub="Example reading" tone="sand"/></div><Chart title="Measurement history" subtitle={`${selected} · Example weekly trend`}/><Panel icon="🛡" title="Designed to support care" text="Unusual readings should be reviewed by a healthcare professional. This prototype does not diagnose conditions or change prescriptions. No sensors or AI analysis are connected."/></>}
 {page==='Notifications'&&<><div className="section-toolbar"><div><h2>Notification center</h2><p>Keep track of reminders and alerts.</p></div><button className="outline-button compact" onClick={()=>action('SOS is not connected. In an emergency, contact local emergency services.')}>SOS emergency</button></div><section className="card">{[...alerts,...extra].map((a,i)=><div className="alert-row" key={a}><div className={'alert-icon '+(alerts.includes(a)?'amber':'green')}><I n="🔔"/></div><div><strong>{a}</strong><p>Example notification · {alerts.includes(a)?'Needs attention':'For review'}</p></div>{alerts.includes(a)&&<button className="text-link" onClick={()=>{setAlerts(alerts.filter(x=>x!==a));action('Example alert acknowledged locally.')}}>Acknowledge</button>}</div>)}</section><p className="muted">Escalation to a designated contact is not connected in this prototype.</p></>}
 {page==='Reports'&&<><div className="section-toolbar"><div><h2>Reports & history</h2><p>Review example records across your SmartMed device.</p></div></div><div className="report-grid">{['Medication & dose collection','Medicine inventory','Health measurements','Storage temperature','Notifications & alerts'].map(r=><section className="card" key={r}><div className="stat-icon green">📄</div><h2>{r}</h2><p className="muted">Example history</p><button className="text-link" onClick={()=>download(r)}>Download example →</button></section>)}</div></>}
 {page==='Settings'&&<div className="secondary-grid"><section className="card"><h2>Account & access</h2><p className="muted">Example workspace roles</p>{['Administrator','Patient','Caregiver or family member','Healthcare professional'].map(r=><div className="detail-line" key={r}>{r}<strong>Role-based access</strong></div>)}<p className="muted">This prototype does not enforce authentication or role permissions. Do not enter real patient data.</p></section><section className="card"><h2>Device settings</h2><p className="muted">SmartMed shared main unit</p><div className="detail-line">Device status <strong>Example online</strong></div><div className="detail-line">Connected patients <strong>{list.length} / 5</strong></div><div className="detail-line">Responsible contact <strong>Not connected</strong></div></section></div>}
 </>;
}

function App(){
 const [page,setPage]=useState('Dashboard'),[menu,setMenu]=useState(false),[notice,setNotice]=useState(''),[selected,setSelected]=useState('Eleanor Pena'),[list,setList]=useState(patients0),[signedIn,setSignedIn]=useState(false),[role,setRole]=useState('Patient'),[alerts,setAlerts]=useState(['Low stock: Lisinopril','Storage temperature check']);
 const go=p=>{setPage(p);setMenu(false);setNotice('')};
 const today=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
 return <div className="app">
 <aside className={menu?'sidebar open':'sidebar'}><Logo/><div className="side-label">WORKSPACE</div>
  <nav>{nav.map(n=><button key={n} className={page===n?'nav-item active':'nav-item'} onClick={()=>go(n)}><I n={G[n]}/><span>{n}</span>{n==='Notifications'&&alerts.length>0&&<b>{alerts.length}</b>}</button>)}</nav>
  <div className="sidebar-bottom"><I n="?"/><div style={{flex:1}}><strong>Need assistance?</strong><p>We're here to help.</p></div>›</div>
  <div className="profile"><div className="avatar olive">JD</div><div style={{flex:1}}><strong>Jane Davis</strong><p>{role} · Demo</p></div><button aria-label="Sign out" onClick={()=>setSignedIn(false)}>⏻</button></div></aside>
 <main className="main"><header className="topbar"><button className="mobile-menu" aria-label="Open navigation" onClick={()=>setMenu(!menu)}>☰</button><div className="breadcrumb">Workspace › <strong>{page}</strong></div>
  <div className="top-actions"><span className="demo-pill">● Demo mode</span><button className="icon-button" aria-label="Notifications" onClick={()=>go('Notifications')}>🔔{alerts.length>0&&<i/>}</button><div className="avatar olive small">JD</div><span className="top-name">Jane Davis</span></div></header>
 <div className="content">{notice&&<div className="notice">✓ {notice}<button onClick={()=>setNotice('')} aria-label="Dismiss">✕</button></div>}
 {page==='Dashboard'?<>
  <div className="page-heading"><div><div className="eyebrow">YOUR CARE AT A GLANCE</div><h1>Good morning, Jane ✳</h1><p>Here's what's happening with your SmartMed device today.</p></div><div className="date-chip">📅 {today}</div></div>
  <div className="overview-title"><div><h2>Overview</h2><p>A quick look at your connected care</p></div><button className="text-link" onClick={()=>go('Reports')}>View reports →</button></div>
  <div className="stats"><Stat icon="👥" label="Registered patients" value={String(list.length).padStart(2,'0')} sub="of 5 patient profiles" tone="green"/><Stat icon="💊" label="Medications" value="04" sub="medicines in device" tone="blue"/><Stat icon="🕒" label="Doses today" value="08" sub="3 upcoming doses" tone="sand"/><Stat icon="⚠" label="Active alerts" value={String(alerts.length).padStart(2,'0')} sub="Needs your attention" tone="rose"/></div>
  <div className="dashboard-grid">
   <section className="card"><div className="card-head"><div><h2>Today's medication schedule</h2><p>Stay on top of today's doses</p></div><button className="text-link" onClick={()=>go('Dispensing Schedule')}>View schedule →</button></div>
    <div className="table-wrap"><table><thead><tr>{['MEDICATION','PATIENT','TIME','STATUS'].map(h=><th key={h}>{h}</th>)}</tr></thead><tbody>{meds.map(m=><tr key={m.name}><td><div className="medicine-cell"><span className="med-icon">💊</span><span><strong>{m.name}</strong><small>{m.dose}</small></span></div></td><td>{m.patient}</td><td>{m.time}</td><td><span className={'status '+(m.status==='Collected'?'success':'upcoming')}>{m.status==='Collected'?'✓':'◷'} {m.status}</span></td></tr>)}</tbody></table></div></section>
   <section className="card"><div className="card-head"><div><h2>Device status</h2><p>SmartMed main unit</p></div><span className="online">● Online</span></div>
    <div className="device-visual"><div className="device-icon">✳</div><div><strong>Everything is connected</strong><p>Last synced just now</p></div></div>
    <div className="device-row"><span>🌡 Storage temperature</span><strong>4.2°C <em>Normal</em></strong></div><div className="device-row"><span>🔋 Battery level</span><strong>92%</strong></div><div className="device-row"><span>📶 Connection</span><strong>Connected</strong></div>
    <button className="outline-button" onClick={()=>go('Medicine Storage')}>View device details →</button></section>
   <section className="card"><div className="card-head"><div><h2>Patients</h2><p>People connected to this device</p></div><button className="text-link" onClick={()=>go('Patients')}>View all →</button></div>
    {list.map(p=><button className="patient-row" key={p.name} onClick={()=>{setSelected(p.name);go('Patients')}}><div className={'avatar '+p.color}>{p.initials}</div><div><strong>{p.name}</strong><p>{p.detail}</p></div>›</button>)}</section>
   <section className="card"><div className="card-head"><div><h2>Needs your attention</h2><p>Updates that may require action</p></div><button className="text-link" onClick={()=>go('Notifications')}>View all →</button></div>
    <div className="alert-row"><div className="alert-icon amber">📦</div><div><strong>Lisinopril is running low</strong><p>8 tablets remaining · Refill recommended</p></div>›</div>
    <div className="alert-row"><div className="alert-icon blush">📅</div><div><strong>Medicine expiring soon</strong><p>Metformin expires in 30 days</p></div>›</div>
    <div className="tip">🛡 Your device is being monitored</div></section>
  </div>
  <div className="footer-note">🛡 Your care, connected and protected. · Example data · Not connected to a medical device</div></>
 :<Secondary {...{page,go,selected,setSelected,list,setList,alerts,setAlerts}} action={setNotice}/>}
 </div></main>
 {!signedIn&&<div className="modal-overlay"><div className="login-card"><Logo/><div className="eyebrow">WELCOME BACK</div><h1>Care starts here.</h1><p className="muted">Sign in to your SmartMed workspace.</p>
  <label>Sign in as<select value={role} onChange={e=>setRole(e.target.value)}><option>Patient</option><option>Caregiver</option><option>Doctor</option><option>Administrator</option></select></label>
  <label>Email address<input defaultValue="jane@example.com"/></label><label>Password<input type="password" defaultValue="demopassword"/></label>
  <button className="primary-button" onClick={()=>{setSignedIn(true);go('Dashboard')}}>Continue to dashboard →</button>
  <p className="login-note">Prototype sign-in only. Roles do not restrict access, and no authentication is connected. Do not enter real patient data.</p></div></div>}
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
